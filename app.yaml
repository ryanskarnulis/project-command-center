# Workspace app manifest — consumed by gateway/gen.py (and later the hub app).
# Schema reference: ../gateway/README.md
name: tasks
title: Project Command Center
description: Project and task management.
icon: "🗂️"
upstream: 127.0.0.1:8100
# Frontend liveness only — the backend's /health is not proxied by nginx.
health: /
lan: true
runtime:
  type: compose
  start: docker compose up -d
  stop: docker compose down
tags: [productivity]
agent:
  description: "Manages projects and tasks: create, find, update, complete, reopen, reschedule, and delete tasks and projects, track dependencies and recurrence, search across everything, and plan the day's focus."
  api: /api/agent
  # Trashing a task or project is gated in code and asks (#503), so conductor
  # delegates it straight through (../agent-standard/app-yaml-agent-block.md).
  confirms: true
  # Takes delegate v1.2's context and read mode, and says needs_input when it
  # asks (#527, ../agent-standard/delegate-api.md "v1.2").
  context: true
  examples:
    - "what's due today"
    - "add a task to fix the fence to the house project"
    - "mark the groceries task done"
    - "what am I blocked on"
    - "create a new project called garage cleanup"
    - "push the dentist appointment to next week"
glance:
  holds: "Today's and overdue open tasks (titles, ids, due dates), today's Focus pin, and the next due date."
  path: /api/agent/glance
