# Serves the built SPA and reverse-proxies /api to the backend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend service over the compose network. The trailing
    # setup preserves the /api prefix (backend mounts its router under /api).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The agent message route runs the local model and legitimately takes
        # tens of seconds (up to ~100s on a cold load). The backend caps a whole
        # run at agent_run_budget_seconds (240s) and returns its own error first;
        # nginx sits above that (240s < 300s) and below the frontend abort
        # (300s < 330s, AGENT_RUN_TIMEOUT_MS) so nginx never 504s a valid run.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Voice uploads are the only large bodies the API takes, and the
        # backend owns the limit: routes_voice.MAX_AUDIO_BYTES is 8 MiB, so
        # this sits 1 MiB above it. Deliberately not equal — a body just over
        # the app's ceiling should get the app's JSON 413, not nginx's HTML
        # error page, while a genuinely absurd upload still dies at the proxy.
        # (nginx's default is 1m, i.e. this deployment used to reject uploads
        # the direct-to-backend LAN path accepted; now both agree.)
        client_max_body_size 9m;
    }

    # nginx's mime.types maps .js but not .mjs, so the onnxruntime loader the
    # VAD dynamically imports (/vad/ort-wasm-simd-threaded.mjs) went out as
    # application/octet-stream and the browser refused it as a module script —
    # hands-free died with "no available backend found". A server-level types
    # block would replace the whole inherited map, so set the type per request.
    location ~ \.mjs$ {
        default_type text/javascript;
        # Regex locations outrank the prefix ones, so this block never inherits
        # the fallback's header — spell it out or the VAD loader is the one
        # file left on heuristic caching.
        add_header Cache-Control "no-cache" always;
    }

    # Vite content-hashes everything under /assets/, so a new build is a new
    # filename and these can never go stale — cache them for a year. The entry
    # document below is what invalidates them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Client-side routing (react-router): unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html names the hashed bundles, so it must revalidate on every
        # load. Without a Cache-Control header nginx leaves browsers to their
        # heuristic (roughly 10% of the age since Last-Modified, per RFC 9111
        # 4.2.2), and a phone that cached the shell before a deploy then boots
        # the *previous* build's JS: in-app navigation never refetches the
        # document, so the old UI survives until the user forces a reload.
        # `no-cache` still permits a 304 against the ETag, so the cost is one
        # conditional request per load, not a re-download.
        #
        # This block also covers the unhashed static files (glitch.png,
        # icons.svg, web.png, /vad/*.wasm), which are overwritten in place by a
        # deploy and so need the same revalidation.
        add_header Cache-Control "no-cache" always;
    }
}
