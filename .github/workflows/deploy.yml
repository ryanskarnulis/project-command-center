# CD: after CI goes green on main, the self-hosted runner on the homelab
# workstation fast-forwards the clean deploy clone (~/deploy/project-command-center) and
# rebuilds the compose stack. The dev checkout in ~/Documents/workspace is
# never touched. If app.yaml changed, the gateway is regenerated too so the
# vhost/launcher stay in sync.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: deploy

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, homelab]
    steps:
      - name: Pull deploy clone and rebuild stack
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd "$HOME/deploy/project-command-center"
          # Refuse to deploy over local edits — the clone must stay pristine.
          git diff --quiet && git diff --cached --quiet || { echo "deploy clone is dirty"; exit 1; }
          before=$(git rev-parse HEAD)
          git fetch origin main
          # Only deploy the commit this CI run actually verified. CI runs for
          # consecutive main commits overlap, so a slow run for an older commit
          # can finish after a newer one lands — deploying current main here
          # would ship a revision no green run ever checked. If main has moved
          # on, this event is stale: skip, and let the newer commit's own CI
          # success deploy it. (Deploying VERIFIED_SHA directly would instead
          # roll production backwards in that case.)
          if [ "$(git rev-parse origin/main)" != "$VERIFIED_SHA" ]; then
            echo "::notice title=Stale deploy skipped::main has moved past the verified commit $VERIFIED_SHA; its own CI run will deploy it."
            exit 0
          fi
          git merge --ff-only origin/main
          docker compose up -d --build
          if ! git diff --quiet "$before" HEAD -- app.yaml; then
            cd "$HOME/deploy/gateway"
            python3 gen.py
            # `up -d --build` won't recreate the gateway container when only
            # the bind-mounted generated files changed; Caddy re-reads them
            # on (re)start, so restart is the real reload (gateway CLAUDE.md).
            docker compose restart
          fi
