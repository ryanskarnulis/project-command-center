# Hand-written eval cases for the summarize_project workflow.
# Run against the real model via `python -m app.ai.evals.run_summary_evals`.
#
# `expect` assertion vocabulary:
#   min_chars / max_chars     bounds on len(summary)
#   contains: [substr...]     each substring (case-insensitive) appears somewhere in the text
#   not_empty: bool           summary is a non-blank string

- name: one_overdue_task
  project_name: Firewall Upgrade
  today: "2026-05-31"
  tasks:
    - title: Replace legacy ACL rules
      workflow_status: open
      priority: high
      due_date: "2026-05-25"
  expect:
    not_empty: true
    min_chars: 30
    max_chars: 800

- name: two_tasks_no_due_dates
  project_name: Blog Redesign
  today: "2026-05-31"
  tasks:
    - title: Write homepage copy
      workflow_status: open
      priority: medium
    - title: Design hero banner
      workflow_status: open
      priority: low
  expect:
    not_empty: true
    min_chars: 30
    max_chars: 800
    contains:
      - "Blog Redesign"

- name: no_tasks
  project_name: Empty Project
  today: "2026-05-31"
  tasks: []
  expect:
    not_empty: true
    min_chars: 5
    max_chars: 200
