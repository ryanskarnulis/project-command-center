# gemma-4-26b-a4b: #417 bake-off candidate. The 26B-A4B MoE sibling of
# gemma-4-12b (same family, chat template and thinking toggle), served by
# ../llama-swap/config.yaml's entry of the same name (QAT UD-Q4_K_XL,
# -ncmoe 17 + MTP drafter, ~60 tok/s) and chess's brain since chess#433.
# Not shipped: gemma-4-12b stays (docs/agent-design.md "Runtime"). Run it
# with LLAMACPP_MODEL=gemma-4-26b-a4b.
thinking_kwarg = "enable_thinking"

# Gemma 4's published sampling, as the GGUF carries it and gemma-4-12b uses.
[sampling]
temperature = 1.0
top_p = 0.95
top_k = 64

# Thinking off, as gemma-4-12b ships. Measured 2026-10-23 (#417) against the
# 12B, paired: thinking off, gate 461/480 with followup_high_priority
# [live_like] at 2/10 (it answered the follow-up without a tool); thinking on
# (`thinking = true` here), gate 470/480 and frontier held-out 62/80 vs 51/80
# (plan_week 6/10 vs 0/10) at ~6x the time per hard ask. Turn thinking on
# before using this model for anything.
[phases.turn]
max_tokens = 2048

[phases.summary]
max_tokens = 512
