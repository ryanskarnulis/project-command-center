# gemma-4-12b: the model PCC's agent shipped on (app/ai/model_profile.py, #402).
# A new model gets its own file named for its llama-swap id, never an edit to
# this one; LLAMACPP_MODEL picks the file.

# The fleet's thinking toggle and tool-calling sampling, copied from
# ../agent-standard/model-profile.md (re-copy on drift, never edit here;
# tests/test_model_profile.py checks it when the sibling checkout is present).
# Thinking stays off on every call the loop makes.
thinking_kwarg = "enable_thinking"

[sampling]
temperature = 1.0
top_p = 0.95
# Not an OpenAI field: llama-server reads it as a plain body field.
top_k = 64

# Every call is capped (#397): llama-server's own default is unbounded, and a
# runaway generation would otherwise run until the run's time budget. A turn's
# cap is the completion reserve the context budget keeps free.
[phases.turn]
max_tokens = 2048
# The planner picks tools cooler than Glitch speaks (#418, as chess's planner
# does: wrong picks 6/40 at 1.0, 0/40 at 0.3). Full gate, 2 paired blocks,
# 2026-10-23: 470/480 at 0.3 vs 466/480 at 1.0, every discordant pair (4)
# 0.3's; no single scenario significant. The narrator keeps [sampling]'s 1.0.
temperature = 0.3

# The narrator writes the reply the single-phase turn used to (#418), at the
# turn's cap.
[phases.narrator]
max_tokens = 2048
