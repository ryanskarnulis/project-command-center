# Model profiles. Code reads a profile by name and uses what's here; never
# hardcode model names or temperatures in workflow code.
#
# Sprint 2 exercises only `task_extraction`. `project_matching` and `summary`
# exist here for shape but are not called yet, and their prompt files are not
# created this sprint.

task_extraction:
  provider: ollama
  model: gemma4:e2b
  temperature: 0
  # 2048, not 1024: a complete multi-task extraction with descriptions overruns
  # 1024 output tokens and truncates mid-JSON (→ invalid/empty output). Raised
  # 2026-05-31 while fixing recall on messy multi-action notes.
  max_tokens: 2048
  response_mode: json_schema
  system_prompt: extract_tasks.md

break_down_task:
  provider: ollama
  model: gemma4:e2b
  temperature: 0
  max_tokens: 2048
  response_mode: json_schema
  system_prompt: break_down_task.md

project_matching:
  provider: ollama
  model: gemma4:e2b
  temperature: 0
  max_tokens: 1024
  response_mode: json_schema
  system_prompt: match_project.md

summary:
  provider: ollama
  model: gemma4:e2b
  temperature: 0.2
  max_tokens: 2048
  response_mode: text
  system_prompt: summarize_project.md
