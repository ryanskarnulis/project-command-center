# Docker-compose deployment for Project Command Center.
#
#   docker compose up --build              # backend + frontend
#
# Copy .env.example -> .env and fill it in first. See README "Deploy with Docker".

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: pcc-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-specific values that override anything in .env.
      DATABASE_URL: sqlite:////data/app.db
      API_HOST: 0.0.0.0            # in-container bind; no host port is published
      # Trusted proxy is nginx (compose subnet); keep in sync with the
      # frontend port binding.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.28.0.0/16}
      FRONTEND_BIND: ${FRONTEND_BIND:-127.0.0.1}
      # Shared llama-swap runtime on the host (../llama-swap/, port 8200),
      # reached via the host-gateway alias below — same mechanism the old
      # Ollama path used. The host proxy binds docker0 (172.17.0.1) as well
      # as loopback; a plain 127.0.0.1 URL would be unreachable from here.
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-http://host.docker.internal:8200/v1}
      # Shared workspace speech service (../speech/, ports 8400/8410). Env var
      # names per ../agent-standard/voice.md. Voice is opt-in: no default is
      # substituted here, so leaving these unset (or empty) in .env runs
      # voiceless and /api/voice answers 503. To enable, set them in .env —
      # .env.example carries the host-gateway URLs to uncomment.
      SPEECH_BASE_URL: ${SPEECH_BASE_URL:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_MODEL: ${TTS_MODEL:-kokoro}
      TTS_VOICE: ${TTS_VOICE:-am_fenrir(2)+am_michael(1)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data              # SQLite file + WAL sidecars + backups persist here
    # No `ports:` — the backend is reachable only over the compose network
    # (nginx), never from the host or LAN directly.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - appnet

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty → relative /api requests, proxied by nginx to the backend.
        VITE_API_URL: ""
    image: pcc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Host-only by default (mirrors API_HOST/DEV_HOST). Set FRONTEND_BIND=0.0.0.0
    # in .env to expose the dashboard on the LAN — required when the workspace
    # gateway (tasks.$HOMELAB_DOMAIN → 127.0.0.1:8100) fronts it, so Settings
    # writes stay re-guarded. Port 8100 sits in the PCC 8100-8199 block; see
    # ../gateway/README.md.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8100}:80"
    networks:
      - appnet

  litestream:
    # Continuous WAL replication of data/app.db. Complements (does not replace)
    # scripts/backup_db.sh. Shares the ./data volume so it can read app.db and
    # write the replica; default target is data/replica/ on the same mount (see
    # litestream.yml for the off-host / S3 upgrade path).
    image: litestream/litestream:0.3
    restart: unless-stopped
    command: replicate
    # Only needed if you enable the s3 replica in litestream.yml (LITESTREAM_S3_*
    # vars). Harmless for the default file replica.
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
    ipam:
      config:
        # Fixed subnet so TRUSTED_PROXY_IPS has a deterministic value to trust
        # (the frontend/nginx container gets an address in this range).
        - subnet: 172.28.0.0/16
