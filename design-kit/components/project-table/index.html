<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project table — Command Center</title>
<link rel="stylesheet" href="../../app.css">
<style>
  body { margin: 0; }
  .kit-page { padding: 32px; max-width: 900px; margin: 0 auto; }
</style>
</head>
<body>
<main class="kit-page">
  <div class="panel">
    <div class="section-heading compact"><div class="section-title"><h2>Projects</h2></div><a href="#">View all</a></div>
    <div class="project-table">
      <div class="project-table-row">
        <div class="project-name-cell">
          <span class="project-avatar tone-blue">CC</span>
          <div><a href="#">Command Center</a><small>18 tasks · 6 in progress</small></div>
        </div>
        <div class="workload-cell">
          <span>64%</span>
          <div class="workload-bar"><span style="width:64%"></span></div>
        </div>
        <span class="status-pill workflow-in_progress">In progress</span>
      </div>
      <div class="project-table-row">
        <div class="project-name-cell">
          <span class="project-avatar tone-green">PR</span>
          <div><a href="#">Personal</a><small>6 tasks · 2 due soon</small></div>
        </div>
        <div class="workload-cell">
          <span>30%</span>
          <div class="workload-bar"><span style="width:30%"></span></div>
        </div>
        <span class="status-pill workflow-open">Open</span>
      </div>
      <div class="project-table-row">
        <div class="project-name-cell">
          <span class="project-avatar tone-purple">AI</span>
          <div><a href="#">AI Subsystem</a><small>11 tasks · all done</small></div>
        </div>
        <div class="workload-cell">
          <span>100%</span>
          <div class="workload-bar"><span style="width:100%"></span></div>
        </div>
        <span class="status-pill workflow-done">Done</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
