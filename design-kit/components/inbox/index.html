<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox capture — Command Center</title>
<link rel="stylesheet" href="../../app.css">
<style>
  body { margin: 0; }
  .kit-page { padding: 32px; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
</style>
</head>
<body>
<main class="kit-page">
  <div class="inbox-capture-panel">
    <div class="inbox-capture-header">
      <div>
        <h2>Capture</h2>
        <p>Drop a raw note — extraction turns it into structured tasks for review.</p>
      </div>
      <button class="secondary-action">Paste</button>
    </div>
    <form class="inbox-capture-form">
      <textarea placeholder="e.g. Follow up with design on the review queue spec by Friday, high priority"></textarea>
      <button class="inbox-submit-button" aria-label="Capture">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </form>
  </div>

  <div class="pending-review-panel">
    <h2>Awaiting review</h2>
    <ul>
      <li>
        <button>Follow up with design on review queue spec</button>
        <button class="secondary-action">Review</button>
      </li>
      <li>
        <button>Schedule sprint 10 planning</button>
        <button class="secondary-action">Review</button>
      </li>
    </ul>
  </div>

  <div class="capture-summary-panel">
    <span class="count-badge">2 extracted</span>
    <span class="confidence">avg 0.88</span>
    <span class="source-pill">inbox</span>
    <span class="suggested-project">Suggested project: Command Center</span>
  </div>
</main>
</body>
</html>
