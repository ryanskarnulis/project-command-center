<!-- @dsCard group="Navigation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation — Command Center</title>
<link rel="stylesheet" href="../../app.css">
<style>
  body { margin: 0; }
  .kit-page { padding: 32px; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .kit-page > header p { color: var(--text-muted); font-weight: 600; }
  .kit-group h2 { margin-bottom: 12px; }
  .nav-demo { max-width: 260px; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<main class="kit-page">
  <header>
    <h1>Navigation</h1>
    <p>Sidebar links, section headings, tabs and breadcrumbs.</p>
  </header>

  <section class="kit-group">
    <h2>Sidebar links</h2>
    <div class="nav-demo">
      <button class="shell-nav-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard <span class="nav-count-badge">3</span>
      </button>
      <button class="shell-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tasks
      </button>
      <button class="shell-nav-link disabled">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Calendar
      </button>
    </div>
  </section>

  <section class="kit-group">
    <h2>Section heading</h2>
    <div class="section-heading">
      <div class="section-title">
        <span class="heading-icon tone-blue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg></span>
        <div><h2>Projects</h2><p>4 active · 1 archived</p></div>
      </div>
      <div class="section-heading-actions">
        <a class="icon-link" href="#" aria-label="Add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></a>
        <a href="#">View all</a>
      </div>
    </div>
  </section>

  <section class="kit-group">
    <h2>Breadcrumb</h2>
    <div class="breadcrumb"><a href="#">Tasks</a> / <a href="#">Command Center</a> / Wire inbox extract</div>
  </section>

  <section class="kit-group">
    <h2>Task tabs</h2>
    <div class="task-tabs">
      <span>All <b>27</b></span>
      <span>Open <b>18</b></span>
      <span>In progress <b>6</b></span>
      <span>Done <b>112</b></span>
    </div>
  </section>

  <section class="kit-group">
    <h2>Settings nav tabs</h2>
    <div class="settings-nav">
      <button class="settings-nav-tab is-active">Profiles</button>
      <button class="settings-nav-tab">Prompts</button>
      <button class="settings-nav-tab">Evals</button>
    </div>
  </section>
</main>
</body>
</html>
