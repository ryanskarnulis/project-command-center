<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons — Command Center</title>
<link rel="stylesheet" href="../../app.css">
<style>
  body { margin: 0; }
  .kit-page { padding: 32px; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .kit-page > header p { color: var(--text-muted); font-weight: 600; }
  .kit-group h2 { margin-bottom: 12px; }
  .kit-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .kit-note { color: var(--text-muted); font-size: 12px; font-family: var(--mono); }
</style>
</head>
<body>
<main class="kit-page">
  <header>
    <h1>Buttons</h1>
    <p>Default control, variants, icon buttons and destructive actions.</p>
  </header>

  <section class="kit-group">
    <h2>Standard</h2>
    <div class="kit-row">
      <button>Default</button>
      <button style="border-color:var(--border-strong);background:var(--surface-soft)">Hover state</button>
      <button class="secondary-action">Secondary action</button>
      <button disabled>Disabled</button>
      <button class="task-action">Task action</button>
    </div>
  </section>

  <section class="kit-group">
    <h2>Icon buttons</h2>
    <div class="kit-row">
      <button class="icon-button" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="notification-dot"></span>
      </button>
      <button class="icon-button compact" aria-label="More">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <button class="task-icon-action" aria-label="Edit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button class="inbox-submit-button" aria-label="Submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </div>
    <p class="kit-note">.icon-button (44px) · .compact (32px) · .task-icon-action (36px) · .inbox-submit-button (blue, 36px)</p>
  </section>

  <section class="kit-group">
    <h2>Destructive</h2>
    <div class="kit-row">
      <button class="danger-action">Danger action</button>
      <button class="trash-danger">Delete permanently</button>
    </div>
  </section>
</main>
</body>
</html>
