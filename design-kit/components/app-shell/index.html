<!-- @dsCard group="Layout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App shell — Command Center</title>
<link rel="stylesheet" href="../../app.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="brand-mark">
      <div class="brand-icon"><span></span><span></span></div>
      <div><strong>Command</strong><span>Center</span></div>
    </div>

    <nav class="shell-nav">
      <button class="shell-nav-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <button class="shell-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1Z"/></svg>
        Inbox
        <span class="nav-count-badge">5</span>
      </button>
      <button class="shell-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tasks
      </button>
    </nav>

    <div class="shell-nav-group">
      <button class="shell-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
        Projects
      </button>
      <button class="shell-nav-link disabled">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Calendar
      </button>
    </div>

    <div class="shell-nav-bottom">
      <div class="focus-session">
        <div class="focus-session-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </div>
        <div>
          <strong>Focus session</strong>
          <span><i></i>23:14 remaining</span>
        </div>
        <button>Pause session</button>
      </div>
      <button class="shell-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 6 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H0"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <div class="app-content">
    <header class="topbar">
      <div class="topbar-title">
        <span>Workspace</span>
        <strong>Dashboard</strong>
      </div>
      <div class="command-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Search tasks, projects, notes…">
        <kbd>⌘K</kbd>
      </div>
      <div class="topbar-actions">
        <button class="icon-button" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="notification-dot"></span>
        </button>
        <span class="local-profile">RK · Local</span>
      </div>
    </header>
    <main class="app-main">
      <main>
        <div class="dashboard-hero">
          <div><h1>Good morning, Ryan</h1><p>You have 5 items in your inbox and 27 active tasks.</p></div>
          <button class="secondary-action">Capture note</button>
        </div>
        <div class="empty-state">App content renders here. See the Dashboard, Tasks and Workflow cards for the inner views.</div>
      </main>
    </main>
  </div>
</div>
</body>
</html>
